# ==============================================================================
# Glance Dashboard Configuration - Homeserver
# TechHut 2025 Homelab Hub
# ==============================================================================

theme:
  background-color: 240 20% 10%
  contrast-multiplier: 1.1
  primary-color: 215 90% 60%

branding:
  custom-title: "Homeserver | TechHut 2025"
  hide-footer: true
  favicon-url: "https://raw.githubusercontent.com/glanceapp/glance/main/assets/icon.svg"

pages:
  - name: Home
    columns:
      # Left Column: Search, System Stats & Hardware Monitoring, Weather
      - size: small
        widgets:
          - type: clock
            hour-format: 12h
            timezones:
              - timezone: Asia/Kolkata
                label: Local Time

          - type: search
            autofocus: true
            search-engine: duckduckgo
            placeholder: Search web or homelab...

          - type: weather
            location: Kochi, India
            unit: metric
            show-forecast: true

          - type: server-stats
            show-hardware: true
            show-cpu: true
            show-memory: true
            show-storage: true
            mountpoints:
              - /
              - /mnt/storage

      # Center Column: Master Services & Media Super-Stack
      - size: full
        widgets:
          - type: bookmarks
            title: "🎬 Media Streaming & Cloud"
            color: 270 70% 60%
            bookmarks:
              - title: Jellyfin
                url: http://<lan-ip>:8096
                same-tab: true
                icon: si:jellyfin
                description: Hardware-Accelerated NVENC Video Streaming
              - title: Immich
                url: http://<lan-ip>:2283
                same-tab: true
                icon: si:googlephotos
                description: Multi-User Isolated Photo & Video Cloud
              - title: Navidrome
                url: http://<lan-ip>:4533
                same-tab: true
                icon: si:spotify
                description: High-Performance Music Server
              - title: Audiobookshelf
                url: http://<lan-ip>:13378
                same-tab: true
                icon: si:audible
                description: Audiobooks & Podcasts Manager

